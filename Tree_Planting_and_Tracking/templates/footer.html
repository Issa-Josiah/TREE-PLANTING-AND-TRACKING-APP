{% load static %}
<footer class="bg-dark text-light py-4 mt-5">
    <div class="container">
        <div class="row align-items-center">

            <!-- Logo and Organization Name -->
            <div class="col-md-4 mb-3 mb-md-0 d-flex align-items-center">
                <img src="{% static 'images/logo.png' %}" alt="Logo" height="50" class="me-2">
                <span class="fw-bold">Tree Planting Organization</span>
            </div>

            <!-- Links -->
            <div class="col-md-4 mb-3 mb-md-0 text-center">
                <a href="{% url 'tree_list' %}" class="text-light text-decoration-none me-3">Trees</a>
                <a href="{% url 'event_list' %}" class="text-light text-decoration-none me-3">Events</a>
                <a href="#" class="text-light text-decoration-none me-3">About Us</a>
            </div>

            <!-- Social Media & Year -->
            <div class="col-md-4 text-md-end text-center">
                <a href="https://facebook.com" class="text-light me-2">
                    <img src="{% static 'images/facebook.png' %}" alt="Facebook" height="24">
                </a>
                <a href="https://twitter.com" class="text-light me-2">
                    <img src="{% static 'images/twitter.png' %}" alt="Twitter" height="24">
                </a>
                <a href="https://instagram.com" class="text-light me-2">
                    <img src="{% static 'images/instagram.png' %}" alt="Instagram" height="24">
                </a>
                <p class="mt-2 mb-0">&copy; {{ current_year }} Tree Planting Organization</p>
            </div>

        </div>
    </div>
</footer>
