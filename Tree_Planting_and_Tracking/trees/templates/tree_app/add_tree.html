{% extends 'home.html' %}

{% block title %}Add Tree{% endblock %}

{% block content %}
<div class="card p-4 custom-card">
    <h2 class="mb-3">Add Tree</h2>

    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <button class="btn btn-success" type="submit">Submit</button>
    </form>
</div>
{% endblock %}
